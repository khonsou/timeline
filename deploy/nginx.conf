# 拾光轴 · Timeline Board —— nginx 反代配置（v15 多用户看板服务）
# 部署形态：nginx 伺服前端静态产物（web/dist/）+ 反代 /api 到本机 Node API server（8787）
# 配合：pm2 托管 packages/server/index.mjs（见 deploy/ecosystem.config.cjs），详细步骤见 docs/deployment.md
server {
    listen 80;
    server_name _; # 换成你的域名或公网 IP

    # 前端静态产物（npm run build 的输出；按实际部署路径修改）
    root /var/www/timeline-board/dist;
    index index.html;

    # gzip：看板 doc 走 API，静态资源压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API 反代 → Node server（packages/server/index.mjs，API_PORT 默认 8787）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 看板 doc 整板覆盖，关闭代理缓冲即时落库
        proxy_buffering off;
        client_max_body_size 10m; # 与 server MAX_BODY(8MB) 对齐留余量
    }

    # 前端 history 路由（/b/:id 看板页）：全部落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
