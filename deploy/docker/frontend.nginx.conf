server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 只允许通过指定路径访问前端，避免根路径暴露应用。
    location = __BASE_PATH__ {
        return 301 __BASE_PATH__/;
    }

    location = __BASE_PATH__/ {
        rewrite ^ /index.html break;
    }

    location __BASE_PATH__/ {
        rewrite ^__BASE_PATH__/?(.*)$ /$1 break;
        try_files $uri __BASE_PATH__/index.html;
    }

    # 兼容兜底：base path 上线前流出的无前缀看板链接（/b/<id>）301 到带前缀地址。
    # 注意：URL hash（#view= / #card=）不会发到服务器，301 只能救到看板级，hash 必然丢失。
    location /b/ {
        return 301 __BASE_PATH__$request_uri;
    }

    location / {
        return 404;
    }
}
