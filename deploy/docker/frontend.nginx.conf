server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 只允许通过指定路径访问前端，避免根路径暴露应用。
    location = /aVoSaywtHjXCA {
        return 301 /aVoSaywtHjXCA/;
    }

    location = /aVoSaywtHjXCA/ {
        rewrite ^ /index.html break;
    }

    location /aVoSaywtHjXCA/ {
        rewrite ^/aVoSaywtHjXCA/?(.*)$ /$1 break;
        try_files $uri /aVoSaywtHjXCA/index.html;
    }

    location / {
        return 404;
    }
}
