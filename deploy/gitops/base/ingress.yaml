apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeline-board-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - timeline.angrymiao.com
      secretName: am-tls
  rules:
    - host: timeline.angrymiao.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: timeline-backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: timeline-frontend-service
                port:
                  number: 80