apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeline-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timeline-frontend
  template:
    metadata:
      labels:
        app: timeline-frontend
    spec:
      containers:
        - name: timeline-frontend
          image: __WEB_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /aVoSaywtHjXCA/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /aVoSaywtHjXCA/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      imagePullSecrets:
        - name: aliyun-reg-secret
